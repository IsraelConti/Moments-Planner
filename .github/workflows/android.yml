name: Build Moments Planner Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Moments Planner
        uses: actions/checkout@v4
      - name: Restore original Moments Planner web sources
        uses: actions/checkout@v4
        with:
          repository: IsraelConti/ToolStock-Pro
          ref: wedding-events-planner
          path: _source
          sparse-checkout: |
            src
      - name: Copy application sources
        run: |
          mkdir -p src
          cp -f _source/src/index.html src/index.html
          cp -f _source/src/app.js src/app.js
          cp -f _source/src/styles.css src/styles.css
          if [ -f _source/src/app-icon.b64 ]; then cp -f _source/src/app-icon.b64 src/app-icon.b64; fi
          rm -rf _source
          test -s src/index.html
          test -s src/app.js
          test -s src/styles.css
      - name: Add editable guest attendance and table assignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          old='''<select data-guest-table="'+g.id+'">'+tableOptions(p,g.tableId)+'</select></div><span class="badge '+esc(g.status)+'">'+(g.status==="confirmed"?"Confirmado":g.status==="declined"?"No asistirá":"Pendiente")+'</span>'''
          new='''<label><small>Asistencia</small><select data-guest-status="'+g.id+'"><option value="pending" '+(g.status==="pending"?"selected":"")+'>Pendiente</option><option value="confirmed" '+(g.status==="confirmed"?"selected":"")+'>Sí asistirá</option><option value="declined" '+(g.status==="declined"?"selected":"")+'>No asistirá</option></select></label><label><small>Mesa</small><select data-guest-table="'+g.id+'" '+(g.status==="declined"?"disabled":"")+'>'+tableOptions(p,g.tableId)+'</select></label></div><span class="badge '+esc(g.status)+'">'+(g.status==="confirmed"?"Confirmado":g.status==="declined"?"No asistirá":"Pendiente")+'</span>'''
          if old not in s: raise SystemExit('guest card marker not found')
          s=s.replace(old,new,1)
          old2='''$$("[data-guest-table]").forEach(s=>s.onchange=()=>{const g=p.guests.find(x=>x.id===s.dataset.guestTable);if(g){g.tableId=s.value;save();toast("Mesa asignada");}});'''
          new2='''$$("[data-guest-status]").forEach(s=>s.onchange=()=>{const g=p.guests.find(x=>x.id===s.dataset.guestStatus);if(g){g.status=s.value;if(g.status==="declined")g.tableId="";save();toast(g.status==="confirmed"?"Asistencia confirmada":g.status==="declined"?"Marcado como no asistirá":"Invitado pendiente");}});\n  $$("[data-guest-table]").forEach(s=>s.onchange=()=>{const g=p.guests.find(x=>x.id===s.dataset.guestTable);if(g){g.tableId=s.value;save();toast("Mesa asignada");}});'''
          if old2 not in s: raise SystemExit('guest table handler marker not found')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build embedded application
        run: |
          base64 --decode src/app-icon.b64 > src/app-icon.png
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp -f src/app-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp -f src/app-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-AAB-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
