name: Build Moments Planner Android

on:
  workflow_dispatch:
  push:
    branches: [main, fix/moments-play-review]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Moments Planner
        uses: actions/checkout@v4
      - name: Validate self-contained Moments Planner sources
        run: |
          test -s src/index.html
          test -s src/app.js
          test -s src/styles.css
          test -s src/app-icon.b64
      - name: Apply Moments Expert professional enhancements
        run: node scripts/enhance-moments.mjs
      - name: Check enhanced JavaScript syntax
        run: node --check src/app.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build embedded application
        run: |
          base64 --decode src/app-icon.b64 > src/app-icon.png
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp -f src/app-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp -f src/app-icon.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Install Chromium test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real browser navigation and JavaScript runtime
        run: node scripts/smoke-ui.mjs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease
      - name: Android emulator installation and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -no-accel
          emulator-boot-timeout: 480
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.momentsplanner.events/.MainActivity
            sleep 12
            adb shell pidof com.momentsplanner.events
            adb logcat -d -t 5000 -v brief > android-smoke-logcat.txt
            if grep -A 12 'FATAL EXCEPTION' android-smoke-logcat.txt | grep -q 'Process: com.momentsplanner.events'; then echo 'Moments Planner Android crash detected'; exit 1; fi
      - name: Upload Android emulator smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-ANDROID-SMOKE-LOG
          path: android-smoke-logcat.txt
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-AAB-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Package source code and build evidence
        run: |
          mkdir -p review-package
          git archive --format=zip --output=review-package/Moments-Planner-source.zip HEAD
          printf 'Commit: %s\nRun: %s\nSource: fix/moments-play-review\nStatus: build only; Android UI, billing and Play review tests pending\nAAB: unsigned; not ready for Play upload\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > review-package/BUILD-REPORT.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/release/app-release.aab > review-package/SHA256SUMS.txt
      - name: Upload source backup and build report
        uses: actions/upload-artifact@v4
        with:
          name: Moments-Planner-SOURCE-AND-REPORT
          path: review-package/
          if-no-files-found: error
